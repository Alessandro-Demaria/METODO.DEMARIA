name: Validation Suite - Metodo Demaria

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Engine Environment Load
        run: |
          python load_engine.py

      - name: Validate Python Modules Import
        run: |
          python -c "import voynich_parser; import batch_runner; import coherence_evaluator; import null_model_runner; import verify_markov; import load_engine; print('TUTTI I MODULI CARICATI CON SUCCESSO')"

      - name: Run Batch Runner Pipeline
        run: |
          python batch_runner.py

      - name: Run Coherence Evaluator Analysis
        run: |
          python coherence_evaluator.py

      - name: Run Null Model Benchmark
        run: |
          python null_model_runner.py

      - name: Run Markov Chain Analysis
        run: |
          python verify_markov.py
