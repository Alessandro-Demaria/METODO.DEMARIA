name: Validation Suite - Metodo Demaria

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Integrity Test on CSV
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('voynich_batch_measurements.csv')
          assert len(df) > 0, 'CSV vuoto!'
          print(f'OK: {len(df)} righe caricate.')
          "

      - name: Validate Python Modules Import
        run: |
          python -c "
          import coherence_evaluator
          import load_engine
          import voynich_parser
          print('OK: Tutti i moduli si importano senza errori.')
          "

      - name: Run Null Model Benchmark
        run: python null_model_runner.py

      - name: Run Markov Chain Analysis
        run: python verify_markov.py
