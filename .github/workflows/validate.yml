name: Validation Suite - Metodo Demaria

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Integrity Test on CSV
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('voynich_batch_measurements.csv')
          assert len(df) == 5612, f'Expected 5612 data rows, got {len(df)}'
          assert 'UNSTABLE' not in df['Status'].values, 'UNSTABLE status found in dataset!'
          assert 'BELOW_PEAK_THRESHOLD' in df['Status'].values, 'BELOW_PEAK_THRESHOLD missing!'
          print('VALIDAZIONE CSV COMPLETATA CON SUCCESSO.')
          "

      - name: Validate Python Modules Import
        run: |
          python -c "
          import batch_runner
          import coherence_evaluator
          import load_engine
          import voynich_parser
          print('TUTTI I MODULI PYTHON SONO STATI CARICATI SENZA ERRORI DI SINTASSI.')
          "

      - name: Run Null Model Benchmark
        run: python null_model_runner.py
