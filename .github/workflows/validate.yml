name: Validation Suite - Metodo Demaria

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Engine Environment Load
        run: |
          python load_engine.py

      - name: Run Markov Chain Analysis
        run: |
          python verify_markov.py

      - name: Run Master Framework Integrity Audit
        run: |
          python master_framework_tester.py

      - name: Run Coherence Evaluator Global Analysis
        run: |
          python coherence_evaluator.py
